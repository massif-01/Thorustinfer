[project]
name = "thorustinfer-cuda-tools"
version = "0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "thorustinfer-tools",
    "cuda-python==13.5.0",
    "tilelang==0.1.15",
    "torch==2.14.0+cu130",
    "torchvision==0.29.0+cu130",
    "transformers[chat-template,vision]>=5.21.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
prerelease = "disallow"
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
thorustinfer-tools = { path = "../../..", editable = true }
torch = { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.14.0%2Bcu130-cp312-cp312-manylinux_2_28_aarch64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu130/torchvision-0.29.0%2Bcu130-cp312-cp312-manylinux_2_28_aarch64.whl" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
